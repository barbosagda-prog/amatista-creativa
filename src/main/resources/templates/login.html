<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso administrador | Amatista Creativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Nunito+Sans:wght@400;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>
<main class="auth-wrap">
    <form class="auth-card" th:action="@{/login}" method="post">
        <h1>Ingreso administrador</h1>

        <p class="msg msg-error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
        <p class="msg msg-ok" th:if="${param.logout}">Cerraste sesión correctamente.</p>

        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required>

        <button class="btn-buy" type="submit">Ingresar</button>
        <a th:href="@{/}">← Volver a la tienda</a>
    </form>
</main>
</body>
</html>
